<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini Agent Console</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.25rem; }
  #log { border: 1px solid #9995; border-radius: 8px; padding: 1rem; min-height: 12rem; white-space: pre-wrap; }
  .user { color: #0969da; }
  .meta { color: #8250df; font-size: 0.85rem; }
  .err  { color: #cf222e; }
  .done { color: #1a7f37; font-size: 0.85rem; }
  form { display: flex; gap: 0.5rem; margin-top: 1rem; }
  input { flex: 1; padding: 0.5rem; }
  button { padding: 0.5rem 1rem; }
  #stop[disabled] { opacity: 0.4; }
</style>
</head>
<body>
<h1>Mini Agent Console</h1>
<p>提示：<code>calc 2+3*4</code> 触发 calculator 工具，<code>echo hello</code> 触发 echo 工具，<code>tool rocket launch</code> 触发未知工具拒绝，其它输入直接回答。</p>
<div id="log" aria-live="polite"></div>
<form id="ask">
  <input id="q" autocomplete="off" placeholder="输入问题，例如 calc 2+3*4">
  <button type="submit">发送</button>
  <button type="button" id="stop" disabled>停止</button>
</form>
<script>
const logEl = document.getElementById('log');
const form = document.getElementById('ask');
const input = document.getElementById('q');
const stopBtn = document.getElementById('stop');
let source = null;
let answerLine = null;

function append(text, cls) {
  const span = document.createElement('span');
  if (cls) span.className = cls;
  span.textContent = text;
  logEl.appendChild(span);
}

function newline() { logEl.appendChild(document.createTextNode('\n')); }

function stopStream() {
  if (source) { source.close(); source = null; }
  stopBtn.disabled = true;
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const q = input.value.trim();
  if (!q) return;
  stopStream();
  append('> ' + q + '\n', 'user');
  answerLine = document.createElement('span');
  logEl.appendChild(answerLine);

  source = new EventSource('/chat?q=' + encodeURIComponent(q));
  stopBtn.disabled = false;

  source.addEventListener('token', (e) => {
    answerLine.textContent += JSON.parse(e.data).token;
  });
  source.addEventListener('tool_call', (e) => {
    const d = JSON.parse(e.data);
    newline();
    append(`[tool_call] ${d.name}(${d.args})\n`, 'meta');
  });
  source.addEventListener('tool_result', (e) => {
    const d = JSON.parse(e.data);
    append(`[tool_result] ${d.name} → ${d.result}\n`, 'meta');
  });
  source.addEventListener('agent_error', (e) => {
    newline();
    append('[error] ' + JSON.parse(e.data).message + '\n', 'err');
  });
  source.addEventListener('done', (e) => {
    newline();
    append('[done] finish_reason=' + JSON.parse(e.data).finish_reason + '\n', 'done');
    stopStream();
  });
  source.addEventListener('error', () => {
    // 网络层错误（非 agent_error 事件）：服务端不可达或连接中断。
    if (source && source.readyState === EventSource.CLOSED) {
      append('[connection closed]\n', 'err');
      stopStream();
    }
  });
});

stopBtn.addEventListener('click', () => {
  stopStream();
  append('[stopped by user]\n', 'done');
});
</script>
</body>
</html>

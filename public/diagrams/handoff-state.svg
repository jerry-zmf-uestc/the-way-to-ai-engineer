<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc"><title id="title">Handoff控制权与执行状态</title><desc id="desc">ready时可原子移交Owner与Revision，running时拒绝移交；执行验证成功返回ready，取消或失败进入终态。Scope、任务和共享账本不改变。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs><rect width="960" height="450" fill="#f8fafc"/><g font-family="system-ui,sans-serif" fill="#0f172a"><text x="480" y="35" text-anchor="middle" font-size="22">控制权移交改变Owner，任务身份与资源归属保持一致</text><rect x="35" y="90" width="220" height="75" rx="10" fill="#dbeafe" stroke="#64748b"/><text x="145.0" y="120" text-anchor="middle" font-size="16">ready / 当前Owner</text><text x="145.0" y="143" text-anchor="middle" font-size="16">等待执行或移交</text><rect x="375" y="90" width="210" height="75" rx="10" fill="#fef3c7" stroke="#64748b"/><text x="480.0" y="120" text-anchor="middle" font-size="16">running</text><text x="480.0" y="143" text-anchor="middle" font-size="16">领取轮次 / Revision+1</text><rect x="700" y="90" width="225" height="75" rx="10" fill="#dbeafe" stroke="#64748b"/><text x="812.5" y="120" text-anchor="middle" font-size="16">ready / 新Owner</text><text x="812.5" y="143" text-anchor="middle" font-size="16">移交后Revision+1</text><path d="M255 115H375" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text x="315" y="96" text-anchor="middle" font-size="14">执行领取</text><path d="M375 150H255" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text x="315" y="177" text-anchor="middle" font-size="14">结果验证</text><path d="M145 90V65H812V90" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text x="480" y="58" text-anchor="middle" font-size="14">批准边 + Scope / Owner / Revision校验</text><path d="M700 140H655V210H480V165" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text x="660" y="190" text-anchor="middle" font-size="14">新Owner执行</text><rect x="350" y="285" width="250" height="75" rx="10" fill="#fee2e2" stroke="#64748b"/><text x="475.0" y="315" text-anchor="middle" font-size="16">failed / canceled</text><text x="475.0" y="338" text-anchor="middle" font-size="16">迟到或未验证事实不提交</text><rect x="35" y="285" width="220" height="75" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="145.0" y="315" text-anchor="middle" font-size="16">completed</text><text x="145.0" y="338" text-anchor="middle" font-size="16">显式结束 / 禁止再接管</text><path d="M430 165V285" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text x="525" y="245" text-anchor="middle" font-size="14">错误 / 取消</text><path d="M240 165V250H330V322H350" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text x="280" y="275" text-anchor="middle" font-size="14">轮次耗尽</text><path d="M145 165V285" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text x="203" y="238" text-anchor="middle" font-size="14">显式完成</text><text x="770" y="282" text-anchor="middle" font-size="15">running期间拒绝移交与重复领取</text><text x="770" y="313" text-anchor="middle" font-size="15">Hops限制移交，Turns限制执行</text><text x="480" y="410" text-anchor="middle" font-size="17">任务ID / Scope / 已验证事实 / 共享工具账本不随Owner重置</text><text x="480" y="438" text-anchor="middle" font-size="15">可信身份不由ID/Owner自报；单实例内存控制，不证明跨进程唯一Owner</text></g></svg>
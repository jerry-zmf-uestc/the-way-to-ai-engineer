<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc"><title id="title">执行反馈、语言经验与下一次尝试</title><desc id="desc">执行者使用任务和经验，环境返回实际观察，评价者检查任务，反思器形成经验供下次输入选择；不更新权重或授予权限。概念图不代表实验已实现跨任务语言记忆。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs><rect width="960" height="460" fill="#f8fafc"/><g font-family="system-ui,sans-serif" fill="#0f172a"><text x="480" y="35" font-size="22" text-anchor="middle">Reflexion概念：用反馈与经验影响后续尝试</text><rect x="25" y="90" width="210" height="78" rx="10" fill="#dbeafe" stroke="#64748b"/><text x="130.0" y="120" font-size="16" text-anchor="middle">执行者 Actor</text><text x="130.0" y="144" font-size="16" text-anchor="middle">任务 + 已选经验</text><rect x="360" y="90" width="235" height="78" rx="10" fill="#dbeafe" stroke="#64748b"/><text x="477.5" y="120" font-size="16" text-anchor="middle">环境与评价者</text><text x="477.5" y="144" font-size="16" text-anchor="middle">实际观察 / 任务反馈</text><rect x="720" y="90" width="215" height="78" rx="10" fill="#fef3c7" stroke="#64748b"/><text x="827.5" y="120" font-size="16" text-anchor="middle">反思器</text><text x="827.5" y="144" font-size="16" text-anchor="middle">具体差距与建议</text><path d="M235 129H360" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="298" y="108" font-size="14" text-anchor="middle">动作与结果</text><path d="M595 129H720" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="657" y="108" font-size="14" text-anchor="middle">失败与约束</text><rect x="360" y="270" width="270" height="78" rx="10" fill="#fef3c7" stroke="#64748b"/><text x="495.0" y="300" font-size="16" text-anchor="middle">有范围的经验缓冲</text><text x="495.0" y="324" font-size="16" text-anchor="middle">来源 / 版本 / 失效条件</text><path d="M827 168V309H630" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="735" y="292" font-size="14" text-anchor="middle">记录语言经验</text><path d="M360 309H130V168" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="143" y="273" font-size="14" text-anchor="middle">下次输入选择</text><text x="480" y="402" font-size="17" text-anchor="middle">权重、执行权限与评估答案不从经验缓冲继承</text><text x="480" y="436" font-size="16" text-anchor="middle">概念流程；已有局部语言反馈链，可靠采用与跨任务收益仍待验</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 570" role="img" aria-labelledby="title desc"><title id="title">Handoff的三处提交窗口</title><desc id="desc">执行意图先保存；工具调用前保存预算预留，工具返回后保存有界内容，角色校验后提交结果与静止快照。三处退出窗口分别保留预留但未知返回、已知返回但无角色提交、已提交角色结果但通知可能丢失；结果记录不自动证明任务完成。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs><rect width="1160" height="570" fill="#f8fafc"/><g font-family="system-ui,sans-serif" fill="#0f172a"><text x="580" y="35" text-anchor="middle" font-size="24">预算预留、工具返回与角色提交是三份不同证据</text><text x="580" y="68" text-anchor="middle" font-size="16">同一私有记录 / 排他写者持有整个读取、执行与保存过程</text><rect x="25" y="105" width="230" height="105" rx="10" fill="#e2e8f0" stroke="#64748b"/><text x="140" y="136" text-anchor="middle" font-size="18">执行意图</text><text x="140" y="166" text-anchor="middle" font-size="15">phase=executing</text><text x="140" y="192" text-anchor="middle" font-size="15">先保存，再进入角色</text><rect x="315" y="105" width="230" height="105" rx="10" fill="#fef3c7" stroke="#64748b"/><text x="430" y="136" text-anchor="middle" font-size="18">预算预留</text><text x="430" y="166" text-anchor="middle" font-size="15">Outcome=reserved</text><text x="430" y="192" text-anchor="middle" font-size="15">Used + 尝试号 / 角色 / 工具</text><rect x="605" y="105" width="230" height="105" rx="10" fill="#dbeafe" stroke="#64748b"/><text x="720" y="136" text-anchor="middle" font-size="18">工具返回</text><text x="720" y="166" text-anchor="middle" font-size="15">returned / error / rejected</text><text x="720" y="192" text-anchor="middle" font-size="15">有界 Raw / 稳定 ErrorCode</text><rect x="895" y="105" width="230" height="105" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="1010" y="136" text-anchor="middle" font-size="18">角色结果与快照</text><text x="1010" y="166" text-anchor="middle" font-size="15">RoleResults + Stable</text><text x="1010" y="192" text-anchor="middle" font-size="15">phase=stable，仍需任务验收</text><path d="M255 156H315" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><path d="M545 156H605" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><path d="M835 156H895" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text x="285" y="235" text-anchor="middle" font-size="14">调用前</text><text x="575" y="235" text-anchor="middle" font-size="14">返回后</text><text x="865" y="235" text-anchor="middle" font-size="14">校验后</text><rect x="25" y="275" width="1100" height="58" rx="8" fill="#fef3c7" stroke="#94a3b8"/><text x="170" y="310" text-anchor="middle" font-size="17">窗口 A：预留后退出</text><text x="490" y="310" text-anchor="middle" font-size="16">已确定：预算登记已提交</text><text x="900" y="310" text-anchor="middle" font-size="15">未确定：工具是否返回、实际费用</text><rect x="25" y="347" width="1100" height="58" rx="8" fill="#dbeafe" stroke="#94a3b8"/><text x="170" y="382" text-anchor="middle" font-size="17">窗口 B：返回后退出</text><text x="490" y="382" text-anchor="middle" font-size="16">已确定：有界返回记录已提交</text><text x="900" y="382" text-anchor="middle" font-size="15">未确定：角色结果；不能自动重复读取</text><rect x="25" y="419" width="1100" height="58" rx="8" fill="#dcfce7" stroke="#94a3b8"/><text x="170" y="454" text-anchor="middle" font-size="17">窗口 C：提交后失联</text><text x="490" y="454" text-anchor="middle" font-size="16">已确定：角色结果与版本已提交</text><text x="900" y="454" text-anchor="middle" font-size="15">未确定：通知送达；先查询可信记录</text><text x="580" y="525" text-anchor="middle" font-size="17">error / rejected 不产生成功观察；保存确认失败不交付内存结果</text><text x="580" y="551" text-anchor="middle" font-size="16">当前入口拒绝未知重做；租约、显式恢复与真实费用仍需另行验证</text></g></svg>
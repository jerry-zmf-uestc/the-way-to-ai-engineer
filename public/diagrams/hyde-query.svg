<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc"><title id="title">直接查询与假想文档查询</title><desc id="desc">两种查询使用相同编码器并检索相同真实资料。假想文档不进入证据库，比较排名与新增生成消耗。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs><rect width="960" height="430" fill="#f8fafc"/><g font-family="system-ui,sans-serif" fill="#0f172a"><text x="480" y="35" text-anchor="middle" font-size="22">HyDE改变查询表示，真实资料仍是检索与证据来源</text><rect x="25" y="157" width="130" height="72" rx="10" fill="#fff" stroke="#64748b"/><text x="90.0" y="186" text-anchor="middle" font-size="17">原始问题</text><rect x="220" y="68" width="205" height="72" rx="10" fill="#dbeafe" stroke="#64748b"/><text x="322.5" y="97" text-anchor="middle" font-size="17">直接编码问题</text><text x="322.5" y="120" text-anchor="middle" font-size="17">MiniLM / 同一Space</text><rect x="220" y="225" width="205" height="72" rx="10" fill="#fef3c7" stroke="#64748b"/><text x="322.5" y="254" text-anchor="middle" font-size="17">生成假想文档</text><text x="322.5" y="277" text-anchor="middle" font-size="17">SmolLM2 / 未验证</text><rect x="485" y="225" width="180" height="72" rx="10" fill="#dbeafe" stroke="#64748b"/><text x="575.0" y="254" text-anchor="middle" font-size="17">编码假想文档</text><text x="575.0" y="277" text-anchor="middle" font-size="17">同一MiniLM</text><rect x="730" y="135" width="205" height="72" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="832.5" y="164" text-anchor="middle" font-size="17">相同真实资料</text><text x="832.5" y="187" text-anchor="middle" font-size="17">Scope / 版本过滤</text><path d="M155 180H185V104H220" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M155 206H185V261H220" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M425 104H835V135" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M425 261H485" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M665 261H835V207" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="530" y="179" text-anchor="middle" font-size="15">只改变查询向量</text><text x="480" y="345" text-anchor="middle" font-size="17">比较：同问题、同语料、同标签 → Recall / 排序 / 生成Token / 延迟</text><text x="480" y="385" text-anchor="middle" font-size="17">假想文本不写入资料库，不转为引用，不作为回答证据</text></g></svg>
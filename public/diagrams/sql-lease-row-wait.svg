<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 710" role="img" aria-labelledby="title desc"><title id="title">行锁等待跨越租约期限</title><desc id="desc">左右两种流程都先由另一连接持有目标行锁，提交请求等待，数据库时间越过租约期限，持锁事务不修改行并释放。旧UPDATE先判断期限，解除等待后仍接受；修复流程先锁定，再判断到期并拒绝更新。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs><rect width="1120" height="710" fill="#f8fafc"/><g font-family="system-ui,sans-serif" fill="#0f172a"><text x="560" y="36" text-anchor="middle" font-size="24" fill="#0f172a">同样等待到期，检查发生的位置决定能否提交</text><text x="560" y="65" text-anchor="middle" font-size="16" fill="#0f172a">受控反例：持锁事务释放时未修改目标行；时间向下推进</text><rect x="70" y="86" width="450" height="565" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="295" y="116" text-anchor="middle" font-size="19" fill="#0f172a">旧流程：UPDATE先判断期限</text><text x="185" y="150" text-anchor="middle" font-size="16" fill="#0f172a">持锁连接</text><text x="410" y="150" text-anchor="middle" font-size="16" fill="#0f172a">提交连接</text><path d="M185 163L185 614" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="5 5"/><path d="M410 163L410 614" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="5 5"/><rect x="113" y="180" width="144" height="34" rx="8" fill="#e2e8f0" stroke="#94a3b8"/><text x="185.0" y="203" text-anchor="middle" font-size="15" fill="#0f172a">持有目标行锁</text><path d="M410 300L185 300" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="297.5" y="289" text-anchor="middle" font-size="14" fill="#0f172a">请求锁，进入等待</text><rect x="403" y="312" width="14" height="180" fill="#dbeafe" stroke="#64748b"/><text x="334" y="378" text-anchor="middle" font-size="14" fill="#0f172a">等待行锁</text><rect x="113" y="492" width="144" height="34" rx="8" fill="#e2e8f0" stroke="#94a3b8"/><text x="185.0" y="515" text-anchor="middle" font-size="15" fill="#0f172a">释放，行未修改</text><path d="M185 535L410 535" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="297.5" y="523" text-anchor="middle" font-size="14" fill="#0f172a">等待结束</text><rect x="600" y="86" width="450" height="565" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="825" y="116" text-anchor="middle" font-size="19" fill="#0f172a">修复：先锁定，再判断期限</text><text x="715" y="150" text-anchor="middle" font-size="16" fill="#0f172a">持锁连接</text><text x="940" y="150" text-anchor="middle" font-size="16" fill="#0f172a">提交连接</text><path d="M715 163L715 614" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="5 5"/><path d="M940 163L940 614" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="5 5"/><rect x="643" y="180" width="144" height="34" rx="8" fill="#e2e8f0" stroke="#94a3b8"/><text x="715.0" y="203" text-anchor="middle" font-size="15" fill="#0f172a">持有目标行锁</text><path d="M940 300L715 300" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="827.5" y="289" text-anchor="middle" font-size="14" fill="#0f172a">请求锁，进入等待</text><rect x="933" y="312" width="14" height="180" fill="#dbeafe" stroke="#64748b"/><text x="864" y="378" text-anchor="middle" font-size="14" fill="#0f172a">等待行锁</text><rect x="643" y="492" width="144" height="34" rx="8" fill="#e2e8f0" stroke="#94a3b8"/><text x="715.0" y="515" text-anchor="middle" font-size="15" fill="#0f172a">释放，行未修改</text><path d="M715 535L940 535" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="827.5" y="523" text-anchor="middle" font-size="14" fill="#0f172a">等待结束</text><rect x="325" y="231" width="170" height="34" rx="8" fill="#fef3c7" stroke="#94a3b8"/><text x="410.0" y="254" text-anchor="middle" font-size="15" fill="#0f172a">期限尚有效：条件通过</text><rect x="855" y="231" width="170" height="34" rx="8" fill="#dbeafe" stroke="#94a3b8"/><text x="940.0" y="254" text-anchor="middle" font-size="15" fill="#0f172a">锁定CTE先执行</text><rect x="81" y="416" width="958" height="39" rx="6" fill="#fef3c7"/><path d="M88 416L1032 416" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="5 5"/><text x="560" y="443" text-anchor="middle" font-size="17" fill="#0f172a">数据库时间已越过 lease_until</text><rect x="307" y="569" width="206" height="34" rx="8" fill="#fee2e2" stroke="#94a3b8"/><text x="410.0" y="592" text-anchor="middle" font-size="15" fill="#0f172a">仍更新：过期结果被接受</text><rect x="844" y="556" width="192" height="57" rx="8" fill="#dcfce7" stroke="#94a3b8"/><text x="940.0" y="579" text-anchor="middle" font-size="15" fill="#0f172a">此时再检查期限</text><text x="940.0" y="602" text-anchor="middle" font-size="15" fill="#0f172a">已到期：不更新</text><text x="560" y="680" text-anchor="middle" font-size="17" fill="#0f172a">行更新后的条件复查 ≠ 任意锁等待后都会重新判断时钟</text><text x="560" y="704" text-anchor="middle" font-size="14" fill="#0f172a">图只解释该SQL提交窗口，不表示外部动作已停止或整个任务已经恢复</text></g></svg>
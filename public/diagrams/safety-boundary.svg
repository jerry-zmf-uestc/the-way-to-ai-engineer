<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title"><title id="title">Safety：资料与模型提议不能改变执行权限</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs><rect width="1100" height="650" fill="#f8fafc"/><g font-family="system-ui,sans-serif" fill="#0f172a">
<text x="30" y="42" font-size="25">Safety：资料与模型提议不能改变执行权限</text>
<rect x="30" y="135" width="230" height="90" rx="9" fill="#fef3c7" stroke="#64748b"/>
<text x="44" y="165" font-size="17">检索资料 / MCP结果</text>
<text x="44" y="192" font-size="17">不可信正文和指令</text>
<rect x="330" y="135" width="230" height="90" rx="9" fill="#fef3c7" stroke="#64748b"/>
<text x="344" y="165" font-size="17">Model</text>
<text x="344" y="192" font-size="17">工具名与参数提议</text>
<rect x="635" y="135" width="240" height="90" rx="9" fill="#dbeafe" stroke="#64748b"/>
<text x="649" y="165" font-size="17">应用Gate</text>
<text x="649" y="192" font-size="17">注册 / Schema / Scope</text>
<path d="M260 180H330" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<text x="275" y="162" font-size="16">数据</text>
<path d="M560 180H635" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<text x="580" y="162" font-size="16">提议</text>
<rect x="590" y="340" width="410" height="90" rx="9" fill="#dbeafe" stroke="#64748b"/>
<text x="604" y="370" font-size="17">可信应用策略</text>
<text x="604" y="397" font-size="17">批准ID / 分类 / 期限 / 总预算</text>
<path d="M755 340V225" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<text x="790" y="290" font-size="16">应用设置，不来自资料</text>
<rect x="60" y="435" width="420" height="90" rx="9" fill="#dcfce7" stroke="#64748b"/>
<text x="74" y="465" font-size="17">Reader：批准资料的只读能力</text>
<text x="74" y="492" font-size="17">返回后复核权限，结果仍untrusted</text>
<path d="M635 200H575V390H275V435" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<text x="355" y="379" font-size="16">通过才执行</text>
<rect x="590" y="485" width="410" height="90" rx="9" fill="#fee2e2" stroke="#64748b"/>
<text x="604" y="515" font-size="17">拒绝与有界审计</text>
<text x="604" y="542" font-size="17">不记录原参数、正文或原始错误</text>
<path d="M875 200H1050V530H1000" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<text x="1005" y="448" font-size="16">拒绝</text>
<text x="30" y="620" font-size="17">权限来自可信应用；HITL只能在允许范围内决定执行，无法把未注册动作变成可执行。</text>
</g></svg>
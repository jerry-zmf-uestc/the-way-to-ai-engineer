<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" role="img" aria-labelledby="title"><title id="title">HITL：批准绑定快照，修改必须重新审核</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs><rect width="1100" height="680" fill="#f8fafc"/><g font-family="system-ui,sans-serif" fill="#0f172a">
<text x="30" y="42" font-size="25">HITL：批准绑定快照，修改必须重新审核</text>
<rect x="30" y="130" width="260" height="90" rx="9" fill="#dbeafe" stroke="#64748b"/>
<text x="44" y="160" font-size="17">waiting：动作已保存</text>
<text x="44" y="187" font-size="17">Run / Scope / v1 / 指纹</text>
<rect x="420" y="130" width="260" height="90" rx="9" fill="#dbeafe" stroke="#64748b"/>
<text x="434" y="160" font-size="17">approved：人确认v1</text>
<text x="434" y="187" font-size="17">当前权限仍是外层约束</text>
<rect x="815" y="130" width="260" height="90" rx="9" fill="#dbeafe" stroke="#64748b"/>
<text x="829" y="160" font-size="17">executing：先提交在途</text>
<text x="829" y="187" font-size="17">调用只读Reader</text>
<path d="M290 170H420" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<text x="324" y="153" font-size="16">明确批准</text>
<path d="M680 170H815" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<text x="688" y="153" font-size="16">复核应用授权</text>
<path d="M550 130V85H165V130" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<text x="280" y="72" font-size="16">Owner修改 → v2与新指纹 → waiting</text>
<rect x="30" y="420" width="340" height="90" rx="9" fill="#fee2e2" stroke="#64748b"/>
<text x="44" y="450" font-size="17">rejected / canceled</text>
<text x="44" y="477" font-size="17">不执行，不伪造成功结果</text>
<rect x="720" y="420" width="355" height="90" rx="9" fill="#ffffff" stroke="#64748b"/>
<text x="734" y="450" font-size="17">completed / failed</text>
<text x="734" y="477" font-size="17">canceled / expired</text>
<text x="734" y="504" font-size="17">返回后校验，再提交</text>
<path d="M155 220V420" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<text x="169" y="318" font-size="16">拒绝 / 取消</text>
<path d="M530 220V345H300V420" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<text x="345" y="332" font-size="16">Owner取消</text>
<path d="M940 220V420" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<text x="952" y="318" font-size="16">输出 / 错误 / 停止</text>
<text x="30" y="584" font-size="17">决定/修改/恢复均核对版本与指纹；过期不继续，waiting不代表授权永久有效。</text>
<text x="30" y="625" font-size="17">重启看见executing → 结果未知；不能自动重跑，显式只读重试仍受尝试与权限限制。</text>
</g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="title desc"><title id="title">依赖无环与资源等待成环</title><desc id="desc">独立任务分别持有DB和CPU并等待对方资源。调度器先检查全部声明资源，全部可用后预留，不让任务持有半份资源等待。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs><rect width="960" height="380" fill="#f8fafc"/><g font-family="system-ui,sans-serif" fill="#0f172a"><text x="245" y="35" font-size="21" text-anchor="middle">独立任务仍可形成资源环</text><text x="730" y="35" font-size="21" text-anchor="middle">一次预留全部声明资源</text><rect x="30" y="105" width="175" height="82" rx="10" fill="#fee2e2" stroke="#64748b"/><text x="117.5" y="136" font-size="16" text-anchor="middle">任务A持有DB</text><text x="117.5" y="160" font-size="16" text-anchor="middle">等待CPU</text><rect x="285" y="105" width="175" height="82" rx="10" fill="#fee2e2" stroke="#64748b"/><text x="372.5" y="136" font-size="16" text-anchor="middle">任务B持有CPU</text><text x="372.5" y="160" font-size="16" text-anchor="middle">等待DB</text><path d="M205 122H245V78H370V105" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="273" y="65" font-size="14" text-anchor="middle">等待B的CPU</text><path d="M285 170H245V220H118V187" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="180" y="245" font-size="14" text-anchor="middle">等待A的DB</text><rect x="550" y="70" width="355" height="82" rx="10" fill="#dbeafe" stroke="#64748b"/><text x="727.5" y="101" font-size="16" text-anchor="middle">检查DB与CPU的剩余槽</text><text x="727.5" y="125" font-size="16" text-anchor="middle">任一不足：保持排队</text><rect x="550" y="205" width="355" height="82" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="727.5" y="236" font-size="16" text-anchor="middle">全部可用：统一预留再派发</text><text x="727.5" y="260" font-size="16" text-anchor="middle">收到该worker返回，才释放预留</text><path d="M728 152V205" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="825" y="183" font-size="14" text-anchor="middle">满足条件</text><text x="480" y="330" font-size="17" text-anchor="middle">仅约束声明资源；Handler自行获取其它资源仍需额外设计</text></g></svg>
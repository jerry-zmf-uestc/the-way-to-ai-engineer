<text x="565" y="135" font-size="18">score = dot(Q,K) / sqrt(d)</text>
<text x="565" y="177" font-size="18">softmax → 以权重组合V</text>
<text x="565" y="219" font-size="18">改变未来Token不影响此前输出</text>
<text x="565" y="261" font-size="18">注意力权重不等于事实正确率</text>
<rect x="35" y="380" width="280" height="90" rx="9" fill="#dbeafe" stroke="#64748b"/>

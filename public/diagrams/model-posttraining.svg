<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img" aria-labelledby="title desc"><title id="title">训练目标与应用执行边界</title><desc id="desc">预训练后可进行监督微调；典型奖励模型RLHF与直接偏好优化使用不同训练路径。应用仍检查协议、事实、权限和预算。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs><rect width="960" height="490" fill="#f8fafc"/><g font-family="system-ui,sans-serif" fill="#0f172a"><text x="480" y="36" text-anchor="middle" font-size="22">训练改变模型倾向，应用决定结果能否交付或执行</text><rect x="45" y="70" width="210" height="76" rx="10" fill="#dbeafe" stroke="#64748b"/><text x="150.0" y="101" text-anchor="middle" font-size="16">预训练</text><text x="150.0" y="125" text-anchor="middle" font-size="16">语料上的Token预测</text><rect x="375" y="70" width="210" height="76" rx="10" fill="#dbeafe" stroke="#64748b"/><text x="480.0" y="101" text-anchor="middle" font-size="16">SFT</text><text x="480.0" y="125" text-anchor="middle" font-size="16">指令与示范响应</text><path d="M255 108H375" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="65" y="205" width="350" height="76" rx="10" fill="#fef3c7" stroke="#64748b"/><text x="240.0" y="236" text-anchor="middle" font-size="16">典型奖励模型RLHF路线</text><text x="240.0" y="260" text-anchor="middle" font-size="16">偏好排序 → 奖励模型 → RL优化</text><rect x="545" y="205" width="350" height="76" rx="10" fill="#fef3c7" stroke="#64748b"/><text x="720.0" y="236" text-anchor="middle" font-size="16">DPO路线</text><text x="720.0" y="260" text-anchor="middle" font-size="16">偏好对 + 策略/参考对数概率</text><path d="M430 146V175H240V205" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M530 146V175H720V205" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="230" y="350" width="500" height="76" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="480.0" y="381" text-anchor="middle" font-size="16">应用调用后的独立判断</text><text x="480.0" y="405" text-anchor="middle" font-size="16">协议 / 证据支持 / 工具授权 / 预算</text><path d="M240 281V320H360V350" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M720 281V320H600V350" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="480" y="458" text-anchor="middle" font-size="17">偏好损失不是事实正确率；数据、目标与部署任务需分别检验</text></g></svg>
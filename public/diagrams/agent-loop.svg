<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" role="img" aria-labelledby="title desc">
<title id="title">Agent Loop：Harness位置与决策流程</title>
<desc id="desc">Loop读取Session、调用Model、执行Tool并回填观察。没有工具提议且Final非空时保存并返回；取消、协议失败、模型错误或预算耗尽时终止。返回文本不等于完成业务任务。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<rect width="960" height="660" rx="16" fill="#f8fafc"/>
<g font-family="system-ui, sans-serif" fill="#0f172a">
<text x="30" y="36" font-size="21" text-anchor="start">01  Loop在Harness中的位置</text>
<rect x="30" y="62" width="900" height="56" rx="10" fill="#eef2ff" stroke="#64748b" stroke-dasharray="6 5"/>
<text x="480.0" y="95.0" font-size="16" text-anchor="middle">Runtime：状态、预算与错误策略  /  Checkpoint：执行恢复  /  Streaming：运行呈现</text>
<rect x="60" y="166" width="190" height="72" rx="10" fill="#ffffff" stroke="#64748b"/>
<text x="155.0" y="195.5" font-size="16" text-anchor="middle">Session</text>
<text x="155.0" y="218.5" font-size="16" text-anchor="middle">消息历史与快照</text>
<rect x="350" y="156" width="240" height="92" rx="10" fill="#dbeafe" stroke="#64748b"/>
<text x="470.0" y="195.5" font-size="16" text-anchor="middle">Agent Loop</text>
<text x="470.0" y="218.5" font-size="16" text-anchor="middle">决定继续还是终止</text>
<rect x="700" y="138" width="200" height="52" rx="10" fill="#ffffff" stroke="#64748b"/>
<text x="800.0" y="169.0" font-size="16" text-anchor="middle">Model：一轮响应</text>
<rect x="700" y="212" width="200" height="52" rx="10" fill="#ffffff" stroke="#64748b"/>
<text x="800.0" y="243.0" font-size="16" text-anchor="middle">Tool：受控执行</text>
<path d="M 250 194 L 350 194" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="300" y="184" font-size="13" text-anchor="middle">读取</text>
<path d="M 350 224 L 250 224" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="300" y="248" font-size="13" text-anchor="middle">追加观察</text>
<path d="M 590 180 L 650 180 L 650 164 L 700 164" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 700 150 L 630 150 L 630 168 L 590 168" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 590 218 L 655 218 L 655 238 L 700 238" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 700 252 L 635 252 L 635 236 L 590 236" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="480" y="295" font-size="14" text-anchor="middle">实线：Loop的调用与数据流；虚线框：相邻部件的职责</text>
<text x="30" y="337" font-size="21" text-anchor="start">02  一次运行如何推进</text>
<rect x="40" y="367" width="150" height="60" rx="10" fill="#ffffff" stroke="#64748b"/>
<text x="115.0" y="390.5" font-size="16" text-anchor="middle">检查取消</text>
<text x="115.0" y="413.5" font-size="16" text-anchor="middle">与剩余轮次</text>
<rect x="265" y="367" width="165" height="60" rx="10" fill="#ffffff" stroke="#64748b"/>
<text x="347.5" y="390.5" font-size="16" text-anchor="middle">调用Model</text>
<text x="347.5" y="413.5" font-size="16" text-anchor="middle">读取消息快照</text>
<rect x="505" y="367" width="170" height="60" rx="10" fill="#ffffff" stroke="#64748b"/>
<text x="590.0" y="390.5" font-size="16" text-anchor="middle">响应分支</text>
<text x="590.0" y="413.5" font-size="16" text-anchor="middle">Final / ToolCalls</text>
<rect x="745" y="367" width="170" height="60" rx="10" fill="#dcfce7" stroke="#64748b"/>
<text x="830.0" y="390.5" font-size="16" text-anchor="middle">无工具且Final非空</text>
<text x="830.0" y="413.5" font-size="16" text-anchor="middle">保存并返回</text>
<path d="M 190 397 L 265 397" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 430 397 L 505 397" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 675 397 L 745 397" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="710" y="385" font-size="13" text-anchor="middle">Final</text>
<rect x="505" y="493" width="170" height="70" rx="10" fill="#ffffff" stroke="#64748b"/>
<text x="590.0" y="521.5" font-size="16" text-anchor="middle">记录提议</text>
<text x="590.0" y="544.5" font-size="16" text-anchor="middle">执行工具</text>
<rect x="265" y="493" width="165" height="70" rx="10" fill="#ffffff" stroke="#64748b"/>
<text x="347.5" y="521.5" font-size="16" text-anchor="middle">回填观察</text>
<text x="347.5" y="544.5" font-size="16" text-anchor="middle">ToolCallID配对</text>
<path d="M 590 427 L 590 493" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="655" y="467" font-size="13" text-anchor="middle">ToolCalls</text>
<path d="M 505 528 L 430 528" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 265 528 L 115 528 L 115 427" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="180" y="517" font-size="13" text-anchor="middle">下一轮</text>
<rect x="40" y="592" width="875" height="42" rx="10" fill="#fee2e2" stroke="#64748b"/>
<text x="477.5" y="618.0" font-size="16" text-anchor="middle">取消 / 超时 / 模型错误 / 空响应 / 轮次耗尽 → 返回错误</text>
<text x="775" y="525" font-size="14" text-anchor="middle">工具取消直接终止</text>
<text x="775" y="548" font-size="14" text-anchor="middle">普通失败回填error观察</text>
</g></svg>
